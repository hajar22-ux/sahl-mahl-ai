<!DOCTYPE html>
<html lang="ar" dir="rtl">  <!-- Arabic language, right-to-left for Darija -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahl Mahl Powered by IA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">  <!-- Free style library -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&display=swap">  <!-- Free Arabic font -->
  <style>
    body { font-family: 'Amiri', serif; background-color: #f8f9fa; }  <!-- Simple styling -->
    .container { max-width: 800px; margin: 50px auto; padding: 20px; background: white; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center">Sahl Mahl Powered by IA</h1>
    <p class="text-center">Upload your study file and get summaries, flashcards in Darija, and a fun podcast!</p>
    
    <!-- Upload area (we'll add JS later) -->
    <form id="uploadForm" class="border p-4 rounded">
      <label for="fileInput">Choose a file (PDF, DOC, TXT):</label>
      <input type="file" id="fileInput" accept=".pdf,.doc,.txt" class="form-control">
    </form>
    
    <button id="generateBtn" class="btn btn-success w-100 mt-3">Generate Sahl Mahl!</button>
    
    <!-- Results area -->
    <div id="results" class="mt-4" style="display: none;">
      <h2>Summary</h2>
      <p id="summaryText">Loading...</p>
      <h2>Flashcards (in Darija)</h2>
      <p id="flashcardsText">Loading...</p>
      <h2>Podcast</h2>
      <audio id="podcastAudio" controls style="display: none;"></audio>
      <p id="podcastText">Generating audio...</p>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>  <!-- Free JS library -->
</body>
</html>
